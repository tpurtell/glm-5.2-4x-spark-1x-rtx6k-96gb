<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">GLMRT cold startup timeline</title>
  <desc id="desc">Measured cold launch of the GLMRT coordinator and four parallel Spark experts. The launcher reached the API in 55.20 seconds, coordinator startup completed in 51.46 seconds, and Spark targets were ready by 24.87 seconds.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1829"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="1" stop-color="#0b182a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#020812" flood-opacity=".45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#28415a" stroke-width="1" opacity=".12"/>
    </pattern>
    <style>
      .title{font:700 29px Inter,Segoe UI,sans-serif;fill:#e9f3ff}
      .subtitle{font:400 14px Inter,Segoe UI,sans-serif;fill:#91a8bf}
      .metric{font:700 25px Inter,Segoe UI,sans-serif;fill:#e9f3ff}
      .metric-label{font:600 11px Inter,Segoe UI,sans-serif;fill:#91a8bf;letter-spacing:.8px}
      .section{font:700 18px Inter,Segoe UI,sans-serif;fill:#e9f3ff}
      .body{font:400 13px Inter,Segoe UI,sans-serif;fill:#b9cde0}
      .small{font:400 11px Inter,Segoe UI,sans-serif;fill:#91a8bf}
      .bar{font:600 11px Inter,Segoe UI,sans-serif;fill:#f4f9ff}
      .mono{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e9f3ff}
    </style>
  </defs>

  <rect width="1200" height="650" fill="url(#background)"/>
  <rect width="1200" height="650" fill="url(#grid)"/>

  <text id="title" x="52" y="50" class="title">GLMRT COLD STARTUP</text>
  <text x="52" y="76" class="subtitle">Coordinator plus four DGX Spark experts · balanced profile · retained August 22, 2026 measurement</text>

  <g filter="url(#shadow)">
    <rect x="52" y="100" width="330" height="94" rx="14" fill="url(#panel)" stroke="#56d69c"/>
    <rect x="406" y="100" width="330" height="94" rx="14" fill="url(#panel)" stroke="#46d7e8"/>
    <rect x="760" y="100" width="388" height="94" rx="14" fill="url(#panel)" stroke="#a978ff"/>
  </g>
  <text x="72" y="137" class="metric" fill="#56d69c">55.20 s</text>
  <text x="72" y="162" class="metric-label">LAUNCHER → API READY</text>
  <text x="72" y="181" class="small">includes validation and process dispatch</text>
  <text x="426" y="137" class="metric" fill="#46d7e8">51.46 s</text>
  <text x="426" y="162" class="metric-label">COORDINATOR STARTUP</text>
  <text x="426" y="181" class="small">daemon validation through graph capture</text>
  <text x="780" y="137" class="metric" fill="#a978ff">24.87 s</text>
  <text x="780" y="162" class="metric-label">SPARK TARGETS READY</text>
  <text x="780" y="181" class="small">all four expert slabs loaded in parallel</text>

  <rect x="52" y="220" width="1096" height="350" rx="18" fill="#0b1829" stroke="#203a55" filter="url(#shadow)"/>
  <text x="78" y="258" class="section">CRITICAL PATH</text>
  <text x="78" y="281" class="subtitle">Full Spark expert reload with cached runtime, catalog, and compiled kernels reused.</text>

  <rect x="250" y="325" width="59.3" height="72" rx="7" fill="#7c9cff" stroke="#91a8ff"/>
  <rect x="309.3" y="325" width="272.4" height="72" rx="7" fill="#a978ff" fill-opacity=".78" stroke="#bd9aff"/>
  <rect x="581.7" y="325" width="25.7" height="72" rx="7" fill="#ffc35a" stroke="#ffd17d"/>
  <rect x="607.4" y="325" width="289.5" height="72" rx="7" fill="#56d69c" fill-opacity=".8" stroke="#74e4af"/>
  <rect x="896.9" y="325" width="39.3" height="72" rx="7" fill="#32b985" stroke="#72e4b2"/>
  <rect x="936.2" y="325" width="49.8" height="72" rx="7" fill="#46d7e8" fill-opacity=".8" stroke="#65e5f2"/>

  <text x="279.7" y="353" class="bar" text-anchor="middle">setup</text>
  <text x="279.7" y="376" class="mono" text-anchor="middle">4.45</text>
  <text x="445.5" y="353" class="bar" text-anchor="middle">Spark readiness wait</text>
  <text x="445.5" y="376" class="mono" text-anchor="middle">20.43 s</text>
  <text x="594.5" y="366" class="mono" text-anchor="middle">1.93</text>
  <text x="752.2" y="353" class="bar" text-anchor="middle">targeted graph capture</text>
  <text x="752.2" y="376" class="mono" text-anchor="middle">21.72 s</text>
  <text x="916.5" y="366" class="mono" text-anchor="middle">2.95</text>
  <text x="961.1" y="353" class="bar" text-anchor="middle">API bind</text>
  <text x="961.1" y="376" class="mono" text-anchor="middle">3.74</text>

  <path d="M250 445H1050" stroke="#38516a" stroke-width="1.5"/>
  <g class="small" text-anchor="middle">
    <path d="M250 439V452" stroke="#587089"/><text x="250" y="473">0 s</text>
    <path d="M383.3 439V452" stroke="#587089"/><text x="383.3" y="473">10</text>
    <path d="M516.7 439V452" stroke="#587089"/><text x="516.7" y="473">20</text>
    <path d="M650 439V452" stroke="#587089"/><text x="650" y="473">30</text>
    <path d="M783.3 439V452" stroke="#587089"/><text x="783.3" y="473">40</text>
    <path d="M916.7 439V452" stroke="#587089"/><text x="916.7" y="473">50</text>
    <path d="M1050 439V452" stroke="#587089"/><text x="1050" y="473">60</text>
  </g>
  <g stroke="#28415a" opacity=".35">
    <path d="M383.3 305V438"/><path d="M516.7 305V438"/><path d="M650 305V438"/>
    <path d="M783.3 305V438"/><path d="M916.7 305V438"/><path d="M1050 305V438"/>
  </g>

  <g class="small">
    <rect x="78" y="522" width="10" height="10" rx="2" fill="#ffc35a"/><text x="96" y="531">expert initialization + executor assembly</text>
    <rect x="350" y="522" width="10" height="10" rx="2" fill="#32b985"/><text x="368" y="531">batched dSpark graph capture</text>
    <rect x="590" y="522" width="10" height="10" rx="2" fill="#46d7e8"/><text x="608" y="531">launcher validation and API bind</text>
  </g>

  <text x="52" y="615" class="body">Measured launcher wall clock: 55.199 s. No new startup run was performed for this release graphic.</text>
</svg>
