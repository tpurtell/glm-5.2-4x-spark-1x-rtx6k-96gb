<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1720" viewBox="0 0 1920 1720" role="img" aria-labelledby="title desc">
<title id="title">GLMRT final clean cold and warm startup timelines</title>
<desc id="desc">Aligned measured cold and warm startup timelines for the GLMRT coordinator and four parallel Spark expert processes. Cold API readiness is 67.63 seconds. Warm API readiness with resident Spark experts is 40.89 seconds.</desc>
<defs>
