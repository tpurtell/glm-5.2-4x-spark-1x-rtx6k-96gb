<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">GLMRT balanced-profile prefill throughput</title>
  <desc id="desc">Prefill tokens per second for suffixes from 1K to 32K tokens over cached contexts from zero to 256K tokens.</desc>
  <rect width="800" height="430" rx="8" fill="#0d1117"/>
  <g font-family="system-ui, sans-serif" fill="#e6edf3">
    <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="600">Balanced prefill throughput</text>
    <text x="390" y="407" text-anchor="middle" font-size="12" fill="#9da7b3">new suffix tokens</text>
    <text x="16" y="185" text-anchor="middle" font-size="12" fill="#9da7b3" transform="rotate(-90 16 185)">tokens / second</text>
  </g>
  <g stroke="#30363d" stroke-width="1">
    <line x1="80" y1="40" x2="700" y2="40"/>
    <line x1="80" y1="137" x2="700" y2="137"/>
    <line x1="80" y1="233" x2="700" y2="233"/>
    <line x1="80" y1="330" x2="700" y2="330"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#9da7b3">
    <text x="68" y="44" text-anchor="end">2,000</text>
    <text x="68" y="141" text-anchor="end">1,500</text>
    <text x="68" y="237" text-anchor="end">1,000</text>
    <text x="68" y="334" text-anchor="end">500</text>
    <text x="80" y="350" text-anchor="middle">1K</text>
    <text x="204" y="350" text-anchor="middle">2K</text>
    <text x="328" y="350" text-anchor="middle">4K</text>
    <text x="452" y="350" text-anchor="middle">8K</text>
    <text x="576" y="350" text-anchor="middle">16K</text>
    <text x="700" y="350" text-anchor="middle">32K</text>
  </g>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5">
    <polyline stroke="#58a6ff" points="80,313.8 204,255.2 328,160.8 452,71.5 576,76.7 700,74.4"/>
    <polyline stroke="#3fb950" points="80,286.3 204,258.5 328,155.2 452,93.2 576,108.4 700,106.7"/>
    <polyline stroke="#d29922" points="80,285.9 204,257.7 328,181.5 452,106.5 576,118.5 700,116.9"/>
    <polyline stroke="#f778ba" points="80,289.0 204,259.0 328,179.6 452,128.5 576,195.4 700,146.9"/>
    <polyline stroke="#a371f7" points="80,288.0 204,270.6 328,222.9 452,161.4 576,166.2 700,173.4"/>
  </g>
  <g>
    <g fill="#58a6ff">
      <circle cx="80" cy="313.8" r="3"/><circle cx="204" cy="255.2" r="3"/><circle cx="328" cy="160.8" r="3"/><circle cx="452" cy="71.5" r="3"/><circle cx="576" cy="76.7" r="3"/><circle cx="700" cy="74.4" r="3"/>
    </g>
    <g fill="#3fb950">
      <circle cx="80" cy="286.3" r="3"/><circle cx="204" cy="258.5" r="3"/><circle cx="328" cy="155.2" r="3"/><circle cx="452" cy="93.2" r="3"/><circle cx="576" cy="108.4" r="3"/><circle cx="700" cy="106.7" r="3"/>
    </g>
    <g fill="#d29922">
      <circle cx="80" cy="285.9" r="3"/><circle cx="204" cy="257.7" r="3"/><circle cx="328" cy="181.5" r="3"/><circle cx="452" cy="106.5" r="3"/><circle cx="576" cy="118.5" r="3"/><circle cx="700" cy="116.9" r="3"/>
    </g>
    <g fill="#f778ba">
      <circle cx="80" cy="289.0" r="3"/><circle cx="204" cy="259.0" r="3"/><circle cx="328" cy="179.6" r="3"/><circle cx="452" cy="128.5" r="3"/><circle cx="576" cy="195.4" r="3"/><circle cx="700" cy="146.9" r="3"/>
    </g>
    <g fill="#a371f7">
      <circle cx="80" cy="288.0" r="3"/><circle cx="204" cy="270.6" r="3"/><circle cx="328" cy="222.9" r="3"/><circle cx="452" cy="161.4" r="3"/><circle cx="576" cy="166.2" r="3"/><circle cx="700" cy="173.4" r="3"/>
    </g>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">
    <line x1="94" y1="378" x2="116" y2="378" stroke="#58a6ff" stroke-width="3"/><text x="122" y="382">0</text>
    <line x1="176" y1="378" x2="198" y2="378" stroke="#3fb950" stroke-width="3"/><text x="204" y="382">32K</text>
    <line x1="278" y1="378" x2="300" y2="378" stroke="#d29922" stroke-width="3"/><text x="306" y="382">64K</text>
    <line x1="388" y1="378" x2="410" y2="378" stroke="#f778ba" stroke-width="3"/><text x="416" y="382">128K</text>
    <line x1="514" y1="378" x2="536" y2="378" stroke="#a371f7" stroke-width="3"/><text x="542" y="382">256K cached context</text>
  </g>
</svg>
