<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">GLMRT EXL3 K3 balanced-profile prefill throughput</title>
  <desc id="desc">Median prefill tokens per second for suffixes from 1K to 32K tokens over cached contexts from zero to 256K tokens using the calibrated GLM-5.2 EXL3 K3 checkpoint.</desc>
  <rect width="800" height="430" rx="8" fill="#0d1117"/>
  <g font-family="system-ui, sans-serif" fill="#e6edf3">
    <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="600">EXL3 K3 · balanced prefill throughput</text>
    <text x="390" y="407" text-anchor="middle" font-size="12" fill="#9da7b3">new suffix tokens</text>
    <text x="16" y="185" text-anchor="middle" font-size="12" fill="#9da7b3" transform="rotate(-90 16 185)">tokens / second</text>
  </g>
  <g stroke="#30363d" stroke-width="1">
    <line x1="80" y1="40" x2="700" y2="40"/><line x1="80" y1="137" x2="700" y2="137"/>
    <line x1="80" y1="233" x2="700" y2="233"/><line x1="80" y1="330" x2="700" y2="330"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#9da7b3">
    <text x="68" y="44" text-anchor="end">2,000</text><text x="68" y="141" text-anchor="end">1,500</text>
    <text x="68" y="237" text-anchor="end">1,000</text><text x="68" y="334" text-anchor="end">500</text>
    <text x="80" y="350" text-anchor="middle">1K</text><text x="204" y="350" text-anchor="middle">2K</text>
    <text x="328" y="350" text-anchor="middle">4K</text><text x="452" y="350" text-anchor="middle">8K</text>
    <text x="576" y="350" text-anchor="middle">16K</text><text x="700" y="350" text-anchor="middle">32K</text>
  </g>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5">
    <polyline stroke="#58a6ff" points="80,291.7 204,227.9 328,157.5 452,114.6 576,99.7 700,96.1"/>
    <polyline stroke="#3fb950" points="80,296.0 204,232.6 328,163.0 452,113.8 576,99.2 700,99.3"/>
    <polyline stroke="#d29922" points="80,297.1 204,229.7 328,163.1 452,107.5 576,105.7 700,112.7"/>
    <polyline stroke="#f778ba" points="80,290.6 204,231.0 328,175.1 452,135.1 576,133.6 700,138.4"/>
    <polyline stroke="#a371f7" points="80,271.0 204,238.9 328,198.9 452,174.1 576,172.2 700,175.1"/>
  </g>
  <g fill="#58a6ff"><circle cx="80" cy="291.7" r="3"/><circle cx="204" cy="227.9" r="3"/><circle cx="328" cy="157.5" r="3"/><circle cx="452" cy="114.6" r="3"/><circle cx="576" cy="99.7" r="3"/><circle cx="700" cy="96.1" r="3"/></g>
  <g fill="#3fb950"><circle cx="80" cy="296.0" r="3"/><circle cx="204" cy="232.6" r="3"/><circle cx="328" cy="163.0" r="3"/><circle cx="452" cy="113.8" r="3"/><circle cx="576" cy="99.2" r="3"/><circle cx="700" cy="99.3" r="3"/></g>
  <g fill="#d29922"><circle cx="80" cy="297.1" r="3"/><circle cx="204" cy="229.7" r="3"/><circle cx="328" cy="163.1" r="3"/><circle cx="452" cy="107.5" r="3"/><circle cx="576" cy="105.7" r="3"/><circle cx="700" cy="112.7" r="3"/></g>
  <g fill="#f778ba"><circle cx="80" cy="290.6" r="3"/><circle cx="204" cy="231.0" r="3"/><circle cx="328" cy="175.1" r="3"/><circle cx="452" cy="135.1" r="3"/><circle cx="576" cy="133.6" r="3"/><circle cx="700" cy="138.4" r="3"/></g>
  <g fill="#a371f7"><circle cx="80" cy="271.0" r="3"/><circle cx="204" cy="238.9" r="3"/><circle cx="328" cy="198.9" r="3"/><circle cx="452" cy="174.1" r="3"/><circle cx="576" cy="172.2" r="3"/><circle cx="700" cy="175.1" r="3"/></g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">
    <line x1="94" y1="378" x2="116" y2="378" stroke="#58a6ff" stroke-width="3"/><text x="122" y="382">0</text>
    <line x1="176" y1="378" x2="198" y2="378" stroke="#3fb950" stroke-width="3"/><text x="204" y="382">32K</text>
    <line x1="278" y1="378" x2="300" y2="378" stroke="#d29922" stroke-width="3"/><text x="306" y="382">64K</text>
    <line x1="388" y1="378" x2="410" y2="378" stroke="#f778ba" stroke-width="3"/><text x="416" y="382">128K</text>
    <line x1="514" y1="378" x2="536" y2="378" stroke="#a371f7" stroke-width="3"/><text x="542" y="382">256K cached context</text>
  </g>
</svg>
