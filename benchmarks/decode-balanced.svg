<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">GLMRT balanced-profile decode throughput</title>
  <desc id="desc">Decode tokens per second for Python code, creative writing, and math at contexts from zero to 256K tokens.</desc>
  <rect width="800" height="430" rx="8" fill="#0d1117"/>
  <g font-family="system-ui, sans-serif" fill="#e6edf3">
    <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="600">Balanced dSpark decode throughput</text>
    <text x="390" y="407" text-anchor="middle" font-size="12" fill="#9da7b3">context tokens</text>
    <text x="16" y="185" text-anchor="middle" font-size="12" fill="#9da7b3" transform="rotate(-90 16 185)">tokens / second</text>
  </g>
  <g stroke="#30363d" stroke-width="1">
    <line x1="80" y1="53.8" x2="700" y2="53.8"/>
    <line x1="80" y1="122.9" x2="700" y2="122.9"/>
    <line x1="80" y1="191.9" x2="700" y2="191.9"/>
    <line x1="80" y1="261.0" x2="700" y2="261.0"/>
    <line x1="80" y1="330" x2="700" y2="330"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#9da7b3">
    <text x="68" y="58" text-anchor="end">35</text>
    <text x="68" y="127" text-anchor="end">30</text>
    <text x="68" y="196" text-anchor="end">25</text>
    <text x="68" y="265" text-anchor="end">20</text>
    <text x="68" y="334" text-anchor="end">15</text>
    <text x="80" y="350" text-anchor="middle">0</text>
    <text x="235" y="350" text-anchor="middle">32K</text>
    <text x="390" y="350" text-anchor="middle">64K</text>
    <text x="545" y="350" text-anchor="middle">128K</text>
    <text x="700" y="350" text-anchor="middle">256K</text>
  </g>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5">
    <polyline stroke="#58a6ff" points="80,66.5 235,86.4 390,81.8 545,107.1 700,134.0"/>
    <polyline stroke="#f778ba" points="80,211.0 235,235.4 390,227.4 545,248.0 700,278.5"/>
    <polyline stroke="#3fb950" points="80,116.1 235,123.3 390,132.1 545,142.1 700,138.9"/>
  </g>
  <g>
    <g fill="#58a6ff">
      <circle cx="80" cy="66.5" r="3"/><circle cx="235" cy="86.4" r="3"/><circle cx="390" cy="81.8" r="3"/><circle cx="545" cy="107.1" r="3"/><circle cx="700" cy="134.0" r="3"/>
    </g>
    <g fill="#f778ba">
      <circle cx="80" cy="211.0" r="3"/><circle cx="235" cy="235.4" r="3"/><circle cx="390" cy="227.4" r="3"/><circle cx="545" cy="248.0" r="3"/><circle cx="700" cy="278.5" r="3"/>
    </g>
    <g fill="#3fb950">
      <circle cx="80" cy="116.1" r="3"/><circle cx="235" cy="123.3" r="3"/><circle cx="390" cy="132.1" r="3"/><circle cx="545" cy="142.1" r="3"/><circle cx="700" cy="138.9" r="3"/>
    </g>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">
    <line x1="190" y1="378" x2="212" y2="378" stroke="#58a6ff" stroke-width="3"/><text x="218" y="382">Python code</text>
    <line x1="320" y1="378" x2="342" y2="378" stroke="#f778ba" stroke-width="3"/><text x="348" y="382">creative writing</text>
    <line x1="482" y1="378" x2="504" y2="378" stroke="#3fb950" stroke-width="3"/><text x="510" y="382">math</text>
  </g>
</svg>
