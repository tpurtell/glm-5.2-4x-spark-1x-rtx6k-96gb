<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">GLMRT EXL3 K3 balanced-profile decode throughput</title>
  <desc id="desc">Pooled decode tokens per second for Python code, creative writing, and math at contexts from zero to 256K tokens using the calibrated GLM-5.2 EXL3 K3 checkpoint.</desc>
  <rect width="800" height="430" rx="8" fill="#0d1117"/>
  <g font-family="system-ui, sans-serif" fill="#e6edf3">
    <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="600">EXL3 K3 · balanced dSpark decode</text>
    <text x="390" y="407" text-anchor="middle" font-size="12" fill="#9da7b3">context tokens</text>
    <text x="16" y="185" text-anchor="middle" font-size="12" fill="#9da7b3" transform="rotate(-90 16 185)">tokens / second</text>
  </g>
  <g stroke="#30363d" stroke-width="1">
    <line x1="80" y1="61.5" x2="700" y2="61.5"/><line x1="80" y1="115.2" x2="700" y2="115.2"/>
    <line x1="80" y1="168.9" x2="700" y2="168.9"/><line x1="80" y1="222.6" x2="700" y2="222.6"/>
    <line x1="80" y1="276.3" x2="700" y2="276.3"/><line x1="80" y1="330" x2="700" y2="330"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#9da7b3">
    <text x="68" y="65.5" text-anchor="end">40</text><text x="68" y="119.2" text-anchor="end">35</text>
    <text x="68" y="172.9" text-anchor="end">30</text><text x="68" y="226.6" text-anchor="end">25</text>
    <text x="68" y="280.3" text-anchor="end">20</text><text x="68" y="334" text-anchor="end">15</text>
    <text x="80" y="350" text-anchor="middle">0</text><text x="235" y="350" text-anchor="middle">32K</text>
    <text x="390" y="350" text-anchor="middle">64K</text><text x="545" y="350" text-anchor="middle">128K</text>
    <text x="700" y="350" text-anchor="middle">256K</text>
  </g>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5">
    <polyline stroke="#58a6ff" points="80,66.7 235,105.3 390,106.1 545,114.7 700,141.5"/>
    <polyline stroke="#f778ba" points="80,224.7 235,243.7 390,242.4 545,259.5 700,288.7"/>
    <polyline stroke="#3fb950" points="80,57.8 235,152.3 390,140.8 545,168.1 700,199.5"/>
  </g>
  <g fill="#58a6ff"><circle cx="80" cy="66.7" r="3"/><circle cx="235" cy="105.3" r="3"/><circle cx="390" cy="106.1" r="3"/><circle cx="545" cy="114.7" r="3"/><circle cx="700" cy="141.5" r="3"/></g>
  <g fill="#f778ba"><circle cx="80" cy="224.7" r="3"/><circle cx="235" cy="243.7" r="3"/><circle cx="390" cy="242.4" r="3"/><circle cx="545" cy="259.5" r="3"/><circle cx="700" cy="288.7" r="3"/></g>
  <g fill="#3fb950"><circle cx="80" cy="57.8" r="3"/><circle cx="235" cy="152.3" r="3"/><circle cx="390" cy="140.8" r="3"/><circle cx="545" cy="168.1" r="3"/><circle cx="700" cy="199.5" r="3"/></g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">
    <line x1="190" y1="378" x2="212" y2="378" stroke="#58a6ff" stroke-width="3"/><text x="218" y="382">Python code</text>
    <line x1="320" y1="378" x2="342" y2="378" stroke="#f778ba" stroke-width="3"/><text x="348" y="382">creative writing</text>
    <line x1="482" y1="378" x2="504" y2="378" stroke="#3fb950" stroke-width="3"/><text x="510" y="382">math</text>
  </g>
</svg>
