[project]
name = "glmrt-reference"
version = "0.1.0"
description = "Reference and oracle utilities for GLMRT phase0"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8",
  "safetensors>=0.4",
  "huggingface-hub>=0.24",
]

[project.optional-dependencies]
torch = ["torch"]
vision = [
  "numpy>=2",
  "pillow>=11",
  "torch",
]

[tool.pytest.ini_options]
testpaths = ["reference/tests"]
pythonpath = ["reference"]
